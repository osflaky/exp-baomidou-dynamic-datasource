name: CI

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true 
    -Dorg.gradle.caching=true

jobs:
  #  We only execute nativeTest on `dynamic-datasource-spring-boot3-starter`, since only Spring Boot OSS 3 provides support for GraalVM Native Image
  test-jdk-ci:
    name: Test CI - JDK ${{ matrix.java-version }} on ${{ matrix.os }} [${{ 
      matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java-version: 21
          arch: x64
          runner: windows-latest
          expander_leg: windows-latest-21-x64
    steps:
    - uses: actions/checkout@v4
    - name: Setup java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
        cache: 'gradle'
    - name: Build test with Gradle (JDK 8)
      if: matrix.java-version == '8'
      run: |
        ./gradlew :dynamic-datasource-spring-boot-starter:clean :dynamic-datasource-spring-boot-starter:test --no-daemon
    - name: Build test with Gradle (JDK 11+)
      if: matrix.java-version != '8'
      run: |
        ./gradlew clean test --no-daemon --parallel
